apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: __APP__
  namespace: __APP__
spec:
  interval: 10m
  releaseName: __APP__
  chartRef:
    kind: OCIRepository
    name: __APP__
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  test:
    enable: true
    ignoreFailures: false
